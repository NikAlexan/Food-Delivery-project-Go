syntax = "proto3";

package order;

option go_package = "food-delivery/order-service/proto/pb";

service OrderService {
  rpc CreateOrder(CreateOrderRequest)         returns (Order);
  rpc GetOrder(OrderIdRequest)                returns (Order);
  rpc ListUserOrders(UserIdRequest)           returns (OrderList);
  rpc UpdateOrderStatus(UpdateStatusRequest)  returns (Order);
  rpc CancelOrder(OrderIdRequest)             returns (Order);
  rpc ProcessPayment(PaymentRequest)          returns (PaymentResponse);
  rpc GetOrderHistory(UserIdRequest)          returns (OrderList);
  rpc CalculateTotal(CartRequest)             returns (TotalResponse);
}

message OrderItem {
  int64  menu_item_id = 1;
  string name         = 2;
  int32  quantity     = 3;
  double price        = 4;
}

message Order {
  int64             id            = 1;
  int64             user_id       = 2;
  int64             restaurant_id = 3;
  repeated OrderItem items        = 4;
  string            status        = 5;
  double            total         = 6;
  string            created_at    = 7;
  string            updated_at    = 8;
}

message Payment {
  int64  id       = 1;
  int64  order_id = 2;
  string status   = 3;
  double amount   = 4;
  string method   = 5;
}

message CreateOrderRequest {
  int64             user_id       = 1;
  int64             restaurant_id = 2;
  repeated OrderItem items        = 3;
}

message OrderIdRequest {
  int64 order_id = 1;
}

message UserIdRequest {
  int64 user_id = 1;
}

message UpdateStatusRequest {
  int64  order_id = 1;
  string status   = 2;
}

message OrderList {
  repeated Order orders = 1;
}

message PaymentRequest {
  int64  order_id = 1;
  string method   = 2;
  double amount   = 3;
}

message PaymentResponse {
  Payment payment = 1;
  bool    success = 2;
}

message CartRequest {
  repeated OrderItem items = 1;
}

message TotalResponse {
  double subtotal     = 1;
  double delivery_fee = 2;
  double total        = 3;
}
