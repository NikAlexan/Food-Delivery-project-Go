# ── Добавить эти сервисы в основной compose.yml проекта ──────────────────────
#
# Также добавить в секцию services postgres:
#   environment:
#     POSTGRES_MULTIPLE_DATABASES: userdb,orderdb
# Или создать отдельный postgres для order-service (показано ниже).

services:

  postgres-orders:
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderdb
    ports:
      - "5434:5432"
    volumes:
      - postgres_orders_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: "-js"
    ports:
      - "4222:4222"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 4222 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  order-service:
    image: golang:1.26-alpine
    restart: unless-stopped
    depends_on:
      postgres-orders:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - ./order-service:/app
    working_dir: /app
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres-orders:5432/orderdb?sslmode=disable
      NATS_URL: nats://nats:4222
      GRPC_ADDR: :50053
    ports:
      - "50053:50053"
    command: |
      sh -c "go run github.com/pressly/goose/v3/cmd/goose@latest -dir migrations postgres $$DATABASE_URL up && go run ./cmd/server"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50053 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  order-gateway:
    image: golang:1.26-alpine
    restart: unless-stopped
    depends_on:
      order-service:
        condition: service_healthy
    volumes:
      - ./order-service:/app/order-service
    working_dir: /app/order-service/gateway
    environment:
      ORDER_SERVICE_ADDR: order-service:50053
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      HTTP_ADDR: :8083
    ports:
      - "8083:8083"
    command: go run ./cmd

volumes:
  postgres_orders_data:
