services:

  postgres:
    image: postgres:18.3-alpine3.23
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: userdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8.4-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  user-service:
    image: golang:1.26-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./user-service:/app
    working_dir: /app
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/userdb?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      GRPC_ADDR: :50051
    ports:
      - "50051:50051"
    command: |
      sh -c "go run github.com/pressly/goose/v3/cmd/goose@latest -dir migrations postgres $$DATABASE_URL up && go run ./cmd/server"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50051 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  restaurant-service:
    image: golang:1.26-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    volumes:
      - ./restaurant-service:/app
    working_dir: /app
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/restaurantdb?sslmode=disable
      REDIS_ADDR: redis:6379
      NATS_URL: nats://nats:4222
      GRPC_ADDR: :50052
    ports:
      - "50052:50052"
    command: |
      sh -c "go run github.com/pressly/goose/v3/cmd/goose@latest -dir migrations postgres $$DATABASE_URL up && go run ./cmd/server"
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 50052 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  api-gateway:
    image: golang:1.26-alpine
    restart: unless-stopped
    depends_on:
      user-service:
        condition: service_healthy
      restaurant-service:
        condition: service_healthy
    volumes:
      - ./api-gateway:/app/api-gateway
      - ./user-service:/app/user-service
      - ./restaurant-service:/app/restaurant-service
    working_dir: /app/api-gateway
    environment:
      USER_SERVICE_ADDR: user-service:50051
      RESTAURANT_SERVICE_ADDR: restaurant-service:50052
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      HTTP_ADDR: :8080
    ports:
      - "8080:8080"
    command: go run ./cmd

volumes:
  postgres_data:
