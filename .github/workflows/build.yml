name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  REPO: nikalexan/food-delivery-project-go

jobs:
  build:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - service: api-gateway
            context: .
            dockerfile: api-gateway/Dockerfile
          - service: user-service
            context: ./user-service
            dockerfile: user-service/Dockerfile
          - service: restaurant-service
            context: ./restaurant-service
            dockerfile: restaurant-service/Dockerfile
          - service: order-service
            context: ./order-service
            dockerfile: order-service/Dockerfile
          - service: delivery-service
            context: ./delivery-service
            dockerfile: delivery-service/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Log in to ghcr.io
        uses: docker/login-action@v3.3.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.REPO }}/${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.REPO }}/${{ matrix.service }}:latest

  deploy:
    name: Trigger deploy in sre-final
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Dispatch deploy event
        run: |
          curl -X POST \
            -H "Authorization: token ${{ secrets.SRE_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            https://api.github.com/repos/NikAlexan/sre-final/dispatches \
            -d "{\"event_type\":\"deploy\",\"client_payload\":{\"sha\":\"${{ github.sha }}\"}}"
